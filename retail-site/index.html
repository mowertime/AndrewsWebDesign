<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Atelier North</title>
  <style>
    :root { --ink: #171918; --paper: #dedbd1; --olive: #686c59; --gold: #c9a341; --line: rgba(23,25,24,.2); }
    * { box-sizing: border-box; } body { margin: 0; background: var(--paper); color: var(--ink); font: 14px/1.6 Georgia, serif; }
    header { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 20px 24px; border-bottom: 1px solid var(--line); } .logo { font: 600 13px/1.1 Arial, sans-serif; letter-spacing: .16em; text-transform: uppercase; } nav { display: flex; gap: 16px; font: 11px Arial, sans-serif; text-transform: uppercase; letter-spacing: .08em; } nav a { color: inherit; text-decoration: none; }
    main { padding: 48px 24px; background: linear-gradient(135deg, var(--paper), #c8c9bc); } .eyebrow { margin: 0 0 12px; color: #555b4a; font: 11px Arial, sans-serif; letter-spacing: .16em; text-transform: uppercase; }
    h1 { max-width: 500px; margin: 0; font-size: clamp(38px, 6vw, 68px); line-height: .95; font-weight: 400; } .intro { max-width: 470px; margin: 22px 0 28px; color: #52574a; }
    .button { display: inline-block; padding: 11px 15px; background: var(--gold); color: var(--ink); font: 11px Arial, sans-serif; letter-spacing: .1em; text-decoration: none; text-transform: uppercase; }
    .collection { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 48px; } .collection div { min-height: 94px; padding: 14px; border-top: 2px solid var(--ink); background: rgba(255,255,255,.25); } .collection strong { display: block; font-size: 20px; font-weight: 400; } .collection span { color: #5a5e50; font: 10px Arial, sans-serif; letter-spacing: .08em; text-transform: uppercase; }
    @media (max-width: 560px) { header { align-items: flex-start; flex-direction: column; } nav { gap: 11px; } main { padding: 36px 20px; } .collection { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header><div class="logo">Atelier North</div><nav><a href="#new">New pieces</a><a href="#story">The story</a><a href="#visit">Visit</a></nav></header>
  <main><p class="eyebrow">Independent goods · considered living</p><h1>Objects with a point of view.</h1><p class="intro">A quieter kind of shop for useful, lasting pieces chosen with care.</p><a class="button" href="#new">Explore the collection</a><div class="collection" id="new"><div><strong>New arrivals</strong><span>Just in</span></div><div><strong>Everyday objects</strong><span>Made to keep</span></div><div><strong>Gift edit</strong><span>Thoughtfully chosen</span></div></div></main>
</body>
</html>
