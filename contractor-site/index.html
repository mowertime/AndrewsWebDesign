<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Northline Builders</title>
  <style>
    :root { --ink: #17201d; --paper: #e9e7df; --sage: #879083; --line: rgba(23,32,29,.22); --gold: #c9a341; }
    * { box-sizing: border-box; } body { margin: 0; background: var(--paper); color: var(--ink); font: 14px/1.6 Georgia, serif; }
    header { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 20px 24px; border-bottom: 1px solid var(--line); }
    .logo { font: 600 13px/1.1 Arial, sans-serif; letter-spacing: .16em; text-transform: uppercase; } nav { display: flex; gap: 16px; font: 11px Arial, sans-serif; text-transform: uppercase; letter-spacing: .08em; } nav a { color: inherit; text-decoration: none; }
    main { padding: 48px 24px; } .eyebrow { margin: 0 0 12px; color: #526057; font: 11px Arial, sans-serif; letter-spacing: .16em; text-transform: uppercase; }
    h1 { max-width: 500px; margin: 0; font-size: clamp(38px, 6vw, 68px); line-height: .95; font-weight: 400; } .intro { max-width: 470px; margin: 22px 0 28px; color: #526057; }
    .button { display: inline-block; padding: 11px 15px; background: var(--ink); color: var(--paper); font: 11px Arial, sans-serif; letter-spacing: .1em; text-decoration: none; text-transform: uppercase; }
    .proof { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 48px; } .proof div { min-height: 94px; padding: 14px; border-top: 2px solid var(--gold); background: var(--sage); } .proof strong { display: block; font-size: 25px; font-weight: 400; } .proof span { font: 10px Arial, sans-serif; letter-spacing: .08em; text-transform: uppercase; }
    @media (max-width: 560px) { header { align-items: flex-start; flex-direction: column; } nav { gap: 11px; } main { padding: 36px 20px; } .proof { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header><div class="logo">Northline Builders</div><nav><a href="#services">Services</a><a href="#projects">Projects</a><a href="#contact">Contact</a></nav></header>
  <main><p class="eyebrow">Residential construction · Natchitoches, LA</p><h1>Built to last. Ready when you are.</h1><p class="intro">Thoughtful homes, honest timelines, and craftsmanship made for the way Louisiana families live.</p><a class="button" href="#contact">Request an estimate</a><div class="proof" id="projects"><div><strong>28</strong><span>Years local</span></div><div><strong>1,200+</strong><span>Homes built</span></div><div><strong>4.9/5</strong><span>Client rating</span></div></div></main>
</body>
</html>
